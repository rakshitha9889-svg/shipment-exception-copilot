image:
  repository: sec-copilot
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

# Name of a Kubernetes Secret holding LLM_API_KEY, FALLBACK_API_KEY, LANGFUSE_* (created by hand, never committed)
secretName: sec-copilot-secrets

env:
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: ""
  FALLBACK_BASE_URL: ""
  FALLBACK_MODEL: ""
  QDRANT_URL: http://qdrant:6333
  LANGFUSE_HOST: https://cloud.langfuse.com

resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}

batch:
  enabled: true
  schedule: "0 2 * * *"   # every night at 02:00
