apiVersion: v1
kind: Pod
metadata:
  name: data-loader
spec:
  containers:
    - name: data-loader
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: sec-data